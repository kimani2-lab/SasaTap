name: sasatap
description: "SasaTap - a production-ready NFC toolkit for reading, writing, inspecting, and automating NFC tags."
publish_to: "none"
version: 1.0.4+4

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_nfc_kit: ^3.7.0
  ndef: ^0.4.0
  provider: ^6.1.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/landing_nfc_hero.jpg
